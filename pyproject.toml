[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memomind-hud-core"
version = "0.1.0"
description = "Simulation-first waveguide HUD components"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["packages/memomind-hud-core/src"]

[tool.pytest.ini_options]
testpaths = ["packages/memomind-hud-core/tests", "projects/01-claude-hud-gate/tests"]
pythonpath = ["packages/memomind-hud-core/src", "projects/01-claude-hud-gate"]
