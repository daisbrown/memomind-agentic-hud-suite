[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memomind-hud-core"
version = "0.1.0"
description = "Simulation-first waveguide HUD components"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6"]
rules = ["PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["packages/memomind-hud-core/src"]

[tool.pytest.ini_options]
testpaths = ["packages/memomind-hud-core/tests", "projects"]
addopts = "--import-mode=importlib"
pythonpath = ["packages/memomind-hud-core/src", "projects/01-claude-hud-gate", "projects/02-moto-hud-copilot", "projects/03-moa-sentinel-hud", "projects/04-voice-mcp-field-ops", "projects/05-delta-pulse-hud", "projects/06-local-rag-whisper-cue", "projects/07-gesture-mac-tmux-pilot"]
